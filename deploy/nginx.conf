server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Browser routes that overlap backend API/static prefixes.
    location = /search { try_files /index.html =404; }
    location = /search/ { try_files /index.html =404; }
    location = /tools { try_files /index.html =404; }
    location = /tools/ { try_files /index.html =404; }
    location = /go-enrichment { try_files /index.html =404; }
    location = /go-enrichment/ { try_files /index.html =404; }
    location = /comparative { try_files /index.html =404; }
    location = /comparative/ { try_files /index.html =404; }

    # Keep this regex before the API regex: /genome/jobs is a React route,
    # while /genome/*.fna and /genome/*.gff.gz are backend data resources.
    location ~ ^/genome(?:/(?:files|run|jobs(?:/[^/]+(?:/(?:result|downloads))?)?))?/?$ {
        try_files /index.html =404;
    }

    location ~ ^/(?:api|health|chromosomes|annotations|kegg-images|tools|genome-api|genome|search|datasets|genes|overview|bwdata|go-enrichment|comparative|static)(?:/|$) {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
