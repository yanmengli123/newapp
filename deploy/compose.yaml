name: newapp

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grcg6a}
      POSTGRES_USER: ${POSTGRES_USER:-grcuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      GRCG6A_BASE_DIR: /data
      GRCG6A_PUBLIC_GENOME: /data
      GRCG6A_GENE_FAMILY_RELEASE_ID: ${GRCG6A_GENE_FAMILY_RELEASE_ID:-gg-gf-2026-07-rc1}
      GRCG6A_LOG_LEVEL: INFO
      DATABASE_URL: postgresql://${POSTGRES_USER:-grcuser}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-grcg6a}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - type: bind
        source: ${DATA_DIR:?Set DATA_DIR in deploy/.env}
        target: /data
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_BLAST_BASE: ${VITE_BLAST_BASE:-/blast-service}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
